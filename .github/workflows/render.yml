name: Render ECOS World Trailer

on:
  workflow_dispatch:
  push:
    paths:
      - "blender_scene.py"
      - "trailer.py"
      - "requirements.txt"
      - ".github/workflows/render.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Blender, FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render 3D ECOS world
        run: |
          blender --background --threads 2 --python-exit-code 1 --python blender_scene.py -- --output ecos-world-silent.mp4 --fps 24 --width 1280 --height 720
          ffmpeg -y -framerate 24 -i ecos_frames/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart ecos-world-silent.mp4
      - name: Add original cinematic score
        run: |
          python -c "from trailer import make_audio; make_audio('ecos-score.wav')"
          ffmpeg -y -i ecos-world-silent.mp4 -i ecos-score.wav -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart ecos-world-trailer.mp4
      - name: Upload trailer and editable Blender scene
        uses: actions/upload-artifact@v4
        with:
          name: ecos-world-trailer
          path: |
            ecos-world-trailer.mp4
            ecos-world.blend
          if-no-files-found: error
          retention-days: 14
