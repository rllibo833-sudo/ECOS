name: Nexus Android CI

on:
  push:
    branches: ["nexus/**"]
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-android.yml"
  pull_request:
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-android.yml"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: nexus/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
