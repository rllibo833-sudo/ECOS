name: Nexus Android CI

on:
  push:
    branches: ["nexus/**"]
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-android.yml"
  pull_request:
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-android.yml"
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Android lint
        run: gradle :app:lintDebug --no-daemon
      - name: Instrumented storage and graph tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Build installable release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apks
          path: |
            nexus/app/build/outputs/apk/debug/app-debug.apk
            nexus/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
